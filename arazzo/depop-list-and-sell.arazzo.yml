arazzo: 1.0.1
info:
  title: List a product and mark it sold
  version: 1.0.0
  summary: Create/update a Depop listing by SKU, verify it, then mark it as sold.
  x-realizes-capability-ids:
  - BC-2370.30
  x-capability-derivation:
    method: 'deterministic join: sourceDescriptions -> per-tag OpenAPI -> tag/capability edge. No classification at this step.'
    min_confidence: 0.7
    sources:
    - capability_id: BC-2370.30
      capability_name: Channel Syndication Management
      spec: depop-products-by-sku-api-openapi.yml
      confidence: 0.7
    model: Turbo EA Capabilities by Vincent Verdet — Turbo EA, https://github.com/vincentmakes/turbo-ea-capabilities, CC BY 4.0
sourceDescriptions:
- name: productsBySkuApi
  url: ../openapi/depop-products-by-sku-api-openapi.yml
  type: openapi
workflows:
- workflowId: listAndSell
  summary: Create or update a listing, read it back, and mark it sold.
  inputs:
    type: object
    properties:
      sku:
        type: string
      product:
        type: object
    required: [sku]
  steps:
  - stepId: createOrUpdate
    operationId: createOrUpdateProduct
    parameters:
    - name: sku
      in: path
      value: $inputs.sku
    requestBody:
      payload: $inputs.product
    successCriteria:
    - condition: $statusCode == 200
  - stepId: verify
    operationId: getProductBySku
    parameters:
    - name: sku
      in: path
      value: $inputs.sku
    successCriteria:
    - condition: $statusCode == 200
  - stepId: markSold
    operationId: markProductAsSold
    parameters:
    - name: sku
      in: path
      value: $inputs.sku
    successCriteria:
    - condition: $statusCode == 200
