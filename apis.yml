name: depop
description: >-
  Depop is a peer-to-peer fashion marketplace where people buy, sell and discover
  secondhand and unique clothing. Its Selling API is an enterprise partner API that
  lets approved partners automate the seller experience on Depop: create and manage
  listings (by SKU, product id or slug), manage orders, mark parcels shipped, issue
  refunds, submit and automate offers, read seller and shipping details, and pull
  shop and product insights. The API is OpenAPI 3.1, secured with per-shop API keys
  and OAuth 2.0 (Authorization Code + PKCE) with granular scopes, documents rate
  limits, and emits webhooks for new orders, refunds and product likes. Access is by
  invitation via developers@depop.com. Depop is backed by Balderton Capital, Creandum,
  EQT Ventures and HV Capital and is owned by Etsy.
